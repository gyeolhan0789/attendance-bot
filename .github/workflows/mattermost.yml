name: Mattermost Attendance Bot

on:
  schedule:
    # Korea time Monday-Friday 08:55 = UTC Sunday-Thursday 23:55
    - cron: "55 23 * * 0-4"

    # Korea time Monday-Friday 18:00 = UTC Monday-Friday 09:00
    - cron: "0 9 * * 1-5"

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        run: python notify.py
