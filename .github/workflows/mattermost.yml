name: Mattermost Attendance Bot

on:
  schedule:
    # GitHub scheduled workflows can start late. Run every 5 minutes and let
    # notify.py send only inside the intended Korea-time windows.
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        run: python notify.py
